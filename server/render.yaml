services:
  - type: web
    name: shapentic-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Set these in the Render dashboard (never commit real values) ─────────
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      # ── AI Keys ─────────────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MESHY_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # ── Redis (Upstash or other) ─────────────────────────────────────────────
      - key: REDIS_URL
        sync: false
